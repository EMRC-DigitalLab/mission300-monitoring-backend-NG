name: Deploy target

# Reusable workflow: does the actual migrate + SSH deploy for ONE
# environment. Called twice from deploy.yml (once per environment) so each
# call shows up as its own job in the Actions graph, instead of one job
# that branches internally - see deploy.yml for the two call sites.

on:
  workflow_call:
    inputs:
      env_name:
        required: true
        type: string
      compose_project:
        required: true
        type: string
      api_host_port:
        required: true
        type: string
      image:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Set here, not on the calling job in deploy.yml - workflow_call callers
    # can't declare `environment:` themselves; it has to be on the job that
    # actually runs, parameterized by the input each call site passes.
    environment: ${{ inputs.env_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies (for prisma CLI)
        run: pnpm install --frozen-lockfile

      - name: Run migrations against ${{ inputs.env_name }} database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm prisma:migrate:deploy

      - name: Copy the compose file to the VPS
        # One shared compose file under /opt/m300-backend, kept in sync on
        # every deploy. Each environment gets its own subdirectory for its
        # .env file only - see the next step.
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          source: "docker/docker-compose.prod.yml"
          target: "/opt/m300-backend"

      - name: Deploy image to Hostinger VPS over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          # GitHub Actions resolves every ${{ }} below into plain text BEFORE
          # this script is sent over SSH - the VPS never sees the secret
          # references themselves, only the resolved values.
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            mkdir -p /opt/m300-backend/${{ inputs.env_name }}
            cat > /opt/m300-backend/${{ inputs.env_name }}/.env <<'ENVEOF'
            NODE_ENV=${{ inputs.env_name }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            RABBITMQ_URL=${{ secrets.RABBITMQ_URL }}
            RABBITMQ_EXCHANGE=m300.events
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_ACCESS_TTL=15m
            JWT_REFRESH_TTL=7d
            CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            RABBITMQ_USER=${{ secrets.RABBITMQ_USER }}
            RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}
            API_HOST_PORT=${{ inputs.api_host_port }}
            ENVEOF

            cd /opt/m300-backend
            export IMAGE=${{ inputs.image }}
            docker compose -p ${{ inputs.compose_project }} -f docker/docker-compose.prod.yml \
              --env-file ${{ inputs.env_name }}/.env pull api
            docker compose -p ${{ inputs.compose_project }} -f docker/docker-compose.prod.yml \
              --env-file ${{ inputs.env_name }}/.env up -d
            docker image prune -f

            # No public domain wired up yet (api is loopback-only, see
            # docker-compose.prod.yml) - so this checks from inside the VPS
            # itself, inline, rather than hitting a public URL from the
            # runner via scripts/health-check.sh (which needs a reachable
            # URL). Switch back to that script against a real domain once
            # DEPLOY_HEALTH_CHECK_URL is set - see .env.github's notes.
            HEALTH_URL="http://127.0.0.1:${{ inputs.api_host_port }}/health"
            for attempt in $(seq 1 30); do
              status=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
              if [ "$status" = "200" ]; then
                echo "Healthy (attempt $attempt/30, HTTP $status)"
                exit 0
              fi
              echo "Not ready yet (attempt $attempt/30, HTTP $status). Retrying in 5s..."
              sleep 5
            done
            echo "Health check failed after 30 attempts: $HEALTH_URL"
            exit 1
