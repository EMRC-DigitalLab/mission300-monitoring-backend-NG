name: Deploy

on:
  push:
    branches: [staging]
    tags: ["v*.*.*"]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Test
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build & Push Image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: |
          # GHCR image names must be lowercase - github.repository preserves
          # the org's actual case ("EMRC-DigitalLab/..."), which Docker
          # rejects outright, so lowercase it here rather than at push time.
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo_lower=$REPO_LOWER" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$REPO_LOWER:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ghcr.io/${{ steps.meta.outputs.repo_lower }}:${{ github.ref_name }}

  # Two separate jobs, each gated by `if:` on what actually triggered this
  # run - only one of them executes per push, the other shows as skipped
  # in the Actions graph, rather than one job that branches internally.
  # Both call the same reusable deploy-target.yml with different inputs.

  deploy-staging:
    name: Deploy → Staging
    needs: build-and-push
    if: github.ref == 'refs/heads/staging'
    uses: ./.github/workflows/deploy-target.yml
    with:
      env_name: staging
      compose_project: m300-backend-staging
      api_host_port: "8099"
      image: ${{ needs.build-and-push.outputs.image }}
    secrets: inherit

  deploy-production:
    name: Deploy → Production
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/deploy-target.yml
    with:
      env_name: production
      compose_project: m300-backend-production
      api_host_port: "8100"
      image: ${{ needs.build-and-push.outputs.image }}
    secrets: inherit
