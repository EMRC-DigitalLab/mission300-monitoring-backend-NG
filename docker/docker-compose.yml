# Local development stack: API (hot reload) + Postgres + RabbitMQ.
# Run from the repository root:
# docker compose -f docker/docker-compose.yml --env-file .env.development up --watch

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-m300}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-m300}
      POSTGRES_DB: ${POSTGRES_DB:-m300}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-m300}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-m300}
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: development
    working_dir: /app
    command: sh -c "rm -rf dist tsconfig*.tsbuildinfo && pnpm prisma:generate && pnpm prisma:migrate:deploy && pnpm dev"
    env_file:
      - ../.env.development
    environment:
      # Containers reach dependencies by Compose service name and container
      # port. Host-side localhost/forwarded ports from .env.development are
      # intentionally overridden for the API container.
      DATABASE_URL: postgresql://${POSTGRES_USER:-m300}:${POSTGRES_PASSWORD:-m300}@postgres:5432/${POSTGRES_DB:-m300}?schema=public
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-m300}:${RABBITMQ_PASSWORD:-m300}@rabbitmq:5672
      PORT: 3000
      # Needed so the CORS allowlist's localhost bypass applies (see
      # src/config/cors.ts) - .env.development's own CORS_ORIGIN may be set
      # to a real deployed origin, not localhost:5175.
      NODE_ENV: development
    ports:
      - "${API_HOST_PORT:-3009}:3000"
    volumes:
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ..
          target: /app
          ignore:
            - node_modules/
            - dist/
            - package.json
            - pnpm-lock.yaml
        - action: rebuild
          path: ../package.json
        - action: rebuild
          path: ../pnpm-lock.yaml

  # Optional local workflow orchestration. Start with `--profile kestra`.
  # Kestra uses a separate database and consumes a dedicated queue bound to
  # the backend's existing topic exchange; it does not alter API delivery.
  kestra-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    profiles: ["kestra"]
    environment:
      POSTGRES_USER: ${KESTRA_DB_USER:-kestra}
      POSTGRES_PASSWORD: ${KESTRA_DB_PASSWORD:-kestra-local-only}
      POSTGRES_DB: ${KESTRA_DB_NAME:-kestra}
    volumes:
      - kestra_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kestra:
    image: kestra/kestra:latest-slim
    restart: unless-stopped
    profiles: ["kestra"]
    user: "root"
    command: server standalone --worker-thread=4
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://kestra-postgres:5432/${KESTRA_DB_NAME:-kestra}
            driver-class-name: org.postgresql.Driver
            username: ${KESTRA_DB_USER:-kestra}
            password: ${KESTRA_DB_PASSWORD:-kestra-local-only}
        kestra:
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: "/app/storage"
          queue:
            type: postgres
          url: http://localhost:8080/
          server:
            basicAuth:
              enabled: true
              username: "${KESTRA_ADMIN_USERNAME:-admin@kestra.io}"
              password: "${KESTRA_ADMIN_PASSWORD:-kestra}"
      SECRET_AMQP_USERNAME: ${SECRET_AMQP_USERNAME:-bTMwMA==}
      SECRET_AMQP_PASSWORD: ${SECRET_AMQP_PASSWORD:-bTMwMA==}
      KESTRA_PLUGINS_AUTO_INSTALL_ENABLED: "true"
    ports:
      - "${KESTRA_HOST_PORT:-8081}:8080"
    volumes:
      - kestra_data:/app/storage
    depends_on:
      kestra-postgres:
        condition: service_healthy

volumes:
  postgres_data:
  kestra_postgres_data:
  kestra_data:
