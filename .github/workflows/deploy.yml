name: Deploy

on:
  push:
    branches: [staging]
    tags: ["v*.*.*"]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Test
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build & Push Image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: |
          # GHCR image names must be lowercase - github.repository preserves
          # the org's actual case ("EMRC-DigitalLab/..."), which Docker
          # rejects outright, so lowercase it here rather than at push time.
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo_lower=$REPO_LOWER" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$REPO_LOWER:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ghcr.io/${{ steps.meta.outputs.repo_lower }}:${{ github.ref_name }}

  # Two fully independent jobs (not two calls to a shared reusable workflow -
  # GitHub visually nests multiple calls to the SAME reusable file into one
  # box, which isn't what we want here). Each is gated by `if:` on what
  # triggered the run, so only one actually executes per push - the other
  # shows as skipped, as its own separate box in the Actions graph.

  deploy-staging:
    name: Deploy → Staging
    needs: build-and-push
    if: github.ref == 'refs/heads/staging'
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy the compose file to the VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          source: "docker/docker-compose.prod.yml"
          target: "/opt/m300-backend"

      - name: Deploy image to Hostinger VPS over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            mkdir -p /opt/m300-backend/staging
            cat > /opt/m300-backend/staging/.env <<'ENVEOF'
            NODE_ENV=staging
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            RABBITMQ_URL=${{ secrets.RABBITMQ_URL }}
            RABBITMQ_EXCHANGE=m300.events
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_ACCESS_TTL=15m
            JWT_REFRESH_TTL=7d
            CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            RABBITMQ_USER=${{ secrets.RABBITMQ_USER }}
            RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            EMAIL_FROM=${{ secrets.EMAIL_FROM }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            BACKEND_URL=${{ secrets.BACKEND_URL }}
            BOOTSTRAP_ADMIN_EMAIL=${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
            BOOTSTRAP_ADMIN_PASSWORD=${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
            API_HOST_PORT=8099
            ENVEOF

            cd /opt/m300-backend
            export IMAGE=${{ needs.build-and-push.outputs.image }}
            docker compose -p m300-backend-staging -f docker/docker-compose.prod.yml \
              --env-file staging/.env pull api

            # Migrations run as a one-off container on the SAME docker
            # network as postgres/rabbitmq - "postgres" as a hostname only
            # resolves inside that network, so this can't run on the bare
            # GitHub Actions runner (that was the original bug here).
            docker compose -p m300-backend-staging -f docker/docker-compose.prod.yml \
              --env-file staging/.env run --rm api npx prisma migrate deploy

            docker compose -p m300-backend-staging -f docker/docker-compose.prod.yml \
              --env-file staging/.env up -d
            docker image prune -f

            # Internal check first - confirms the container we just started
            # is actually serving, independent of DNS/nginx/TLS.
            HEALTH_URL="http://127.0.0.1:8099/health"
            for attempt in $(seq 1 30); do
              status=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
              if [ "$status" = "200" ]; then
                echo "Healthy (attempt $attempt/30, HTTP $status)"
                exit 0
              fi
              echo "Not ready yet (attempt $attempt/30, HTTP $status). Retrying in 5s..."
              sleep 5
            done
            echo "Health check failed after 30 attempts: $HEALTH_URL"
            exit 1

      - name: External health check (through DNS + nginx + TLS)
        # Runs from the GitHub runner, not the VPS - this is the only check
        # that actually proves the public path works end-to-end (the
        # internal check above only proves the container itself is up).
        run: bash scripts/health-check.sh "${{ secrets.DEPLOY_HEALTH_CHECK_URL }}"

  deploy-production:
    name: Deploy → Production
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy the compose file to the VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          source: "docker/docker-compose.prod.yml"
          target: "/opt/m300-backend"

      - name: Deploy image to Hostinger VPS over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            mkdir -p /opt/m300-backend/production
            cat > /opt/m300-backend/production/.env <<'ENVEOF'
            NODE_ENV=production
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            RABBITMQ_URL=${{ secrets.RABBITMQ_URL }}
            RABBITMQ_EXCHANGE=m300.events
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_ACCESS_TTL=15m
            JWT_REFRESH_TTL=7d
            CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            RABBITMQ_USER=${{ secrets.RABBITMQ_USER }}
            RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            EMAIL_FROM=${{ secrets.EMAIL_FROM }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            BACKEND_URL=${{ secrets.BACKEND_URL }}
            BOOTSTRAP_ADMIN_EMAIL=${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
            BOOTSTRAP_ADMIN_PASSWORD=${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
            API_HOST_PORT=8100
            ENVEOF

            cd /opt/m300-backend
            export IMAGE=${{ needs.build-and-push.outputs.image }}
            docker compose -p m300-backend-production -f docker/docker-compose.prod.yml \
              --env-file production/.env pull api

            docker compose -p m300-backend-production -f docker/docker-compose.prod.yml \
              --env-file production/.env run --rm api npx prisma migrate deploy

            docker compose -p m300-backend-production -f docker/docker-compose.prod.yml \
              --env-file production/.env up -d
            docker image prune -f

            HEALTH_URL="http://127.0.0.1:8100/health"
            for attempt in $(seq 1 30); do
              status=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
              if [ "$status" = "200" ]; then
                echo "Healthy (attempt $attempt/30, HTTP $status)"
                exit 0
              fi
              echo "Not ready yet (attempt $attempt/30, HTTP $status). Retrying in 5s..."
              sleep 5
            done
            echo "Health check failed after 30 attempts: $HEALTH_URL"
            exit 1

      - name: External health check (through DNS + nginx + TLS)
        run: bash scripts/health-check.sh "${{ secrets.DEPLOY_HEALTH_CHECK_URL }}"
