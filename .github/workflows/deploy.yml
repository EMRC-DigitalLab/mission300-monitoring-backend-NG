name: Deploy

on:
  push:
    branches: [staging]
    tags: ["v*.*.*"]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:${{ github.sha }}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}

  migrate-and-deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'staging' && 'staging' || 'production' }}
    env:
      # Both environments share ONE Hostinger VPS - these are what keep them
      # from colliding: separate Compose project name, separate env file,
      # separate host port. Bumping these is the only thing needed if the
      # port ever needs to change (see docker ps on the box for what's taken).
      ENV_NAME: ${{ github.ref_name == 'staging' && 'staging' || 'production' }}
      COMPOSE_PROJECT: ${{ github.ref_name == 'staging' && 'm300-backend-staging' || 'm300-backend-production' }}
      API_HOST_PORT: ${{ github.ref_name == 'staging' && '8099' || '8100' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies (for prisma CLI)
        run: pnpm install --frozen-lockfile

      - name: Run migrations against target database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm prisma:migrate:deploy

      - name: Copy the compose file to the VPS
        # One shared compose file under /opt/m300-backend, kept in sync on
        # every deploy. Each environment gets its own subdirectory for its
        # .env file only - see the next step.
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          source: "docker/docker-compose.prod.yml"
          target: "/opt/m300-backend"

      - name: Deploy image to Hostinger VPS over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          # GitHub Actions resolves every ${{ }} below into plain text BEFORE
          # this script is sent over SSH - the VPS never sees the secret
          # references themselves, only the resolved values.
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            mkdir -p /opt/m300-backend/${{ env.ENV_NAME }}
            cat > /opt/m300-backend/${{ env.ENV_NAME }}/.env <<'ENVEOF'
            NODE_ENV=${{ env.ENV_NAME }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            RABBITMQ_URL=${{ secrets.RABBITMQ_URL }}
            RABBITMQ_EXCHANGE=m300.events
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_ACCESS_TTL=15m
            JWT_REFRESH_TTL=7d
            CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            RABBITMQ_USER=${{ secrets.RABBITMQ_USER }}
            RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}
            API_HOST_PORT=${{ env.API_HOST_PORT }}
            ENVEOF

            cd /opt/m300-backend
            export IMAGE=${{ needs.build-and-push.outputs.image }}
            docker compose -p ${{ env.COMPOSE_PROJECT }} -f docker/docker-compose.prod.yml \
              --env-file ${{ env.ENV_NAME }}/.env pull api
            docker compose -p ${{ env.COMPOSE_PROJECT }} -f docker/docker-compose.prod.yml \
              --env-file ${{ env.ENV_NAME }}/.env up -d
            docker image prune -f

            # No public domain wired up yet (api is loopback-only, see
            # docker-compose.prod.yml) - so this checks from inside the VPS
            # itself, inline, rather than hitting a public URL from the
            # runner via scripts/health-check.sh (which needs a reachable
            # URL). Switch back to that script against a real domain once
            # DEPLOY_HEALTH_CHECK_URL is set - see .env.github's notes.
            HEALTH_URL="http://127.0.0.1:${{ env.API_HOST_PORT }}/health"
            for attempt in $(seq 1 30); do
              status=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
              if [ "$status" = "200" ]; then
                echo "Healthy (attempt $attempt/30, HTTP $status)"
                exit 0
              fi
              echo "Not ready yet (attempt $attempt/30, HTTP $status). Retrying in 5s..."
              sleep 5
            done
            echo "Health check failed after 30 attempts: $HEALTH_URL"
            exit 1
