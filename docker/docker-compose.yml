# Local development stack: API (hot-reload, mounted source) + Postgres + RabbitMQ.
# Usage: docker compose -f docker/docker-compose.yml --env-file ../.env.development up

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: m300
      POSTGRES_PASSWORD: m300
      POSTGRES_DB: m300
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U m300"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: m300
      RABBITMQ_DEFAULT_PASS: m300
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: deps
    working_dir: /app
    command: sh -c "pnpm prisma:generate && pnpm prisma:migrate:dev && pnpm dev"
    env_file:
      - ../.env.development
    ports:
      - "3000:3000"
    volumes:
      - ..:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
