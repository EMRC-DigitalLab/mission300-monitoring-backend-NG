name: CI

on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_call: {} # allows deploy.yml to use this as a reusable test gate

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: m300
          POSTGRES_PASSWORD: m300
          POSTGRES_DB: m300_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U m300"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: m300
          RABBITMQ_DEFAULT_PASS: m300
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://m300:m300@localhost:5432/m300_test?schema=public
      RABBITMQ_URL: amqp://m300:m300@localhost:5672
      JWT_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        # Must run before lint/typecheck: @prisma/client is an empty stub
        # until this runs, so anything that imports it fails to typecheck
        # on a fresh checkout (this bit us - worked locally only because a
        # prior local run had already generated the client on disk).
        run: pnpm prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Prisma migrate (test DB)
        run: pnpm prisma:migrate:deploy

      - name: Unit tests
        run: pnpm test

      - name: E2E tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

      - name: Docker build (test only, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: m300-backend:ci
